# Optena reviewer access — nginx front end
#
# Design constraint: this host already serves three production vhosts from
# /etc/nginx/sites-enabled/ (cortafy as default_server on 80/443, payfonte.cortafy.com,
# pentrestglobal.com). This file deliberately listens on a SEPARATE PORT (8080) and
# adds a NEW site file, so none of those configs is modified and port 80/443 behaviour
# is unchanged.
#
# Install as: /etc/nginx/sites-available/optena
# Enable with: ln -s /etc/nginx/sites-available/optena /etc/nginx/sites-enabled/optena
#
# Then open TCP 8080 to the reviewer's IP in security group launch-wizard-2.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Streamlit has no authentication of its own. This is the only access control.
    auth_basic "Optena review access";
    auth_basic_user_file /etc/nginx/.optena_htpasswd;

    # The sample dataset is small; keep uploads bounded.
    client_max_body_size 32m;

    access_log /var/log/nginx/optena_access.log;
    error_log  /var/log/nginx/optena_error.log;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # Streamlit is websocket-driven; without these the UI loads but never updates.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Streamlit's websocket endpoint.
    location /_stcore/stream {
        proxy_pass http://127.0.0.1:8501/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
